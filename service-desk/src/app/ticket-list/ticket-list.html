@for (ticket of tickets; track ticket.id) {
<tr>
    <td>{{ ticket.id }}</td>
    <td>{{ ticket.title }}</td>
    <td>{{ ticket.priority }}</td>
    <td>{{ ticket.status }}</td>
</tr>
}
<tr>
  <td colspan="4" style="text-align: center; padding: 12px;">
    <button (click)="addTicket()">+ Add New Ticket</button>
  </td>
</tr>
